<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <a href="#" class="logo">

      <span class="logo-icone">Resenha Books</span>
    </a>

    <button class="menu" aria-label="abrir menu" aria-expanded="false"> </button>

    <nav class="nav">

      <a href="#" class="on"> Buscar </a>
      <a href="#"> Quero ler</a>
      <a href="#"> Lendo</a>
      <a href="#"> Lidos</a>
    </nav>
  </header>
  <main>

    <section class="busca">

      <h1>Buscar livros</h1>
      <form class="busca-form">

        <label for="campo-busca" class="sr-only">

          Titulo ou autor
        </label>
        <input type="search" id="busca-campo" name="f" placeholder="Autor ou titulo" required>

        <button type="submit">Buscar</button>
      </form>

      </form>
    </section>
    <section class="resultados">

      <article class="book">

        <img class="book-capa"
        src="https://covers.openlibrary.org/b/isbn/0140328726-M.jpg"
        alt="capa"
        loading="lazy">

        <div class ="book-info">

          <h2 class ="book-titulo">
            Default
          </h2>
          <p class= "book-autor">
            neymar jr
          </p>

          <p class ="book-ano">
            2001
          </p>

          <button class ="book-botao" type="button">
            amigos da resenha
          </button>
        </div>

      </article>

    </section>
  </main>

  <footer>
    <p>Feito por [André Campos]</p>
  </footer>

  <script src=" script.js"></script>
