<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resenha Books</title>
  <meta name="description" content="Busque livros e organize suas leituras">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <a href="#" class="logo">

      <span class="logonome">
        <span class="logo1">Resenha</span>
        <span class="logo2">Books</span>
      </span>
      <span class="logo3"> Leia o Livro Universo em Desencanto</span>
    </a>

    <button class="menu" aria-label="Abrir menu" aria-expanded="false">☰</button>

    <nav class="nav">
      <a href="#" class="on" data-lista="busca">Buscar</a>
      <a href="#" data-lista="queroler">Quero ler</a>
      <a href="#" data-lista="lendo">Lendo</a>
      <a href="#" data-lista="lidos">Lidos</a>
    </nav>
  </header>

  <main>
    <section class="busca">
      <h1>Buscar livros</h1>
      <p class="busca-sub"> Encontre livros e monte suas listas de leitura. </p>
      <form class="busca-form">
        <label for="campo-busca" class="sr-only">Título ou autor</label>
        <input type="search" id="campo-busca" name="q" placeholder="Autor ou título" required>
        <button type="submit">Buscar</button>
      </form>
    </section>

    <section class="resultados"></section>
  </main>

  <footer>
    <p>Feito por [André Campos]</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
