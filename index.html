<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resenha Books</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <a href="#" class="logo">
      <span class="logo-icone">Resenha Books</span>
    </a>

    <button class="menu" aria-label="Abrir menu" aria-expanded="false">☰</button>

    <nav class="nav">
      <a href="#" class="on">Buscar</a>
      <a href="#">Quero ler</a>
      <a href="#">Lendo</a>
      <a href="#">Lidos</a>
    </nav>
  </header>

  <main>
    <section class="busca">
      <h1>Buscar livros</h1>

      <form class="busca-form">
        <label for="campo-busca" class="sr-only">Título ou autor</label>
        <input type="search" id="campo-busca" name="q" placeholder="Autor ou título" required>
        <button type="submit">Buscar</button>
      </form>
    </section>

    <section class="resultados"></section>
  </main>

  <footer>
    <p>Feito por [André Campos]</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
